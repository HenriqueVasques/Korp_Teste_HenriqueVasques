<div style="padding: 1.5rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h2 style="margin: 0;">📦 Cadastro de Produtos (Estoque)</h2>
    <button type="button" (click)="showDialog()">+ Novo Produto</button>
  </div>

  <p-table [value]="products" [paginator]="true" sortField="productCode" [sortOrder]="1" [rows]="10">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="productCode">Código <p-sortIcon field="productCode"></p-sortIcon></th>
        <th pSortableColumn="description">Descrição <p-sortIcon field="description"></p-sortIcon></th>
        <th pSortableColumn="balance">Qtd. Estoque <p-sortIcon field="balance"></p-sortIcon></th>
        <th style="width: 160px; text-align: center;">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.productCode }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.balance }}</td>
        <td style="text-align: center; display: flex; gap: 8px; justify-content: center;">
          <button type="button" 
                  style="background: #f59e0b; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;" 
                  (click)="editProduct(product)">
            Editar
          </button>
          
          <button type="button" 
                  style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;" 
                  [disabled]="deletingProductId === (product.id ?? product.productId)"
                  (click)="deleteProduct(product)">
            {{ deletingProductId === (product.id ?? product.productId) ? 'Excluindo...' : 'Excluir' }}
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" style="text-align: center; padding: 1.5rem;">
          Nenhum produto cadastrado no momento.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Modal para Cadastro / Edição -->
<p-dialog 
  [header]="isEditMode ? 'Editar Produto' : 'Cadastrar Novo Produto'" 
  [(visible)]="displayDialog"
  [modal]="true" 
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [style]="{ width: '450px' }">
  
  <div style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0;">
    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <label for="code">Código do Produto</label>
      <input type="text" id="code" [(ngModel)]="newProduct.productCode" placeholder="Ex: PRD001" />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <label for="description">Descrição</label>
      <input type="text" id="description" [(ngModel)]="newProduct.description" placeholder="Ex: Teclado Mecânico" />
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
      <label for="quantity">Quantidade em Estoque</label>
      <input type="number" id="quantity" [(ngModel)]="newProduct.balance" min="0" placeholder="0" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button type="button" style="background: transparent; color: #666; margin-right: 8px;" (click)="closeDialog()">Cancelar</button>
    <button type="button" [disabled]="isSubmitting" (click)="saveProduct()">
      {{ isSubmitting ? 'Salvando...' : 'Salvar' }}
    </button>
  </ng-template>
</p-dialog>
